    <!-- Self-Healing Watchdog: detects stale cached bundles or broken service workers -->
    <script>
      (function() {
        // 1. Handle stale module fetch errors (e.g. 404 on deleted chunks)
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          var src = (e && e.filename) ? e.filename : '';
          if (msg.includes('failed to fetch dynamically imported module') || 
              msg.includes('unexpected token \'<\'') || 
              src.includes('assets/')) {
            console.warn('[Watchdog] Stale bundle error detected. Auto-refreshing caches...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
              });
            }
            // Auto reload after brief moment if not reloaded recently
            var lastRecovery = sessionStorage.getItem('ifspl_last_auto_recovery');
            var now = Date.now();
            if (!lastRecovery || (now - parseInt(lastRecovery, 10)) > 10000) {
              sessionStorage.setItem('ifspl_last_auto_recovery', String(now));
              window.location.reload(true);
            }
          }
        }, true);

        // 2. Timeout Watchdog: if app takes > 3.5s to mount React, show instant recovery button
        setTimeout(function() {
          var spinner = document.getElementById('ifspl-root-spinner');
          var retryBox = document.getElementById('ifspl-slow-load-notice');
          if (spinner && retryBox) {
            retryBox.style.display = 'block';
          }
        }, 3500);
      })();

      function forceAppQuickReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
        window.location.reload(true);
      }
    </script>
