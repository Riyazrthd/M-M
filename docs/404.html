<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indus Fire Safety — Loading</title>
    <script>
      (function() {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        // If a user landed on /M-M/docs/ or any broken link, redirect to root /M-M/ with params preserved
        if (window.location.hostname.includes('github.io')) {
          window.location.replace('/M-M/' + search + hash);
        } else {
          window.location.replace('./' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 80vh; text-align: center; color: #111827;">
    <div>
      <p style="font-weight: 600;">Redirecting to Indus Fire Safety Inspection System...</p>
      <p><a href="/M-M/" style="color: #A80018; font-weight: 600;">Click here to open application</a></p>
    </div>
  </body>
</html>
