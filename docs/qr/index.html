<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indus Fire Safety — Loading</title>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname || '';
        var search = l.search || '';
        var hash = l.hash || '';

        // Extract QR token from path like /M-M/qr/TOKEN or /qr/TOKEN
        var qrMatch = pathname.match(/(?:\/qr\/|\/scan\/|\/pos\/|\/tag\/)([^\/\?\#]+)/i);
        var base = l.hostname.includes('github.io') ? '/M-M/' : './';

        if (qrMatch && qrMatch[1]) {
          var token = decodeURIComponent(qrMatch[1]);
          var cleanSearch = search.replace(/[\?&]qr=[^&]*/g, '').replace(/^&/, '?');
          var sep = cleanSearch ? (cleanSearch.includes('?') ? '&' : '?') : '?';
          l.replace(base + (cleanSearch || '') + sep + 'qr=' + encodeURIComponent(token) + hash);
          return;
        }

        // SPA redirect for other routes
        var cleanPath = pathname.replace(/^\/M-M\/?/, '').replace(/^\/+/, '');
        if (cleanPath && cleanPath !== 'index.html') {
          var sep = search ? '&' : '?';
          l.replace(base + search + sep + 'route=' + encodeURIComponent(cleanPath) + hash);
          return;
        }

        l.replace(base + search + hash);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 80vh; text-align: center; color: #111827; background: #F8FAFC;">
    <div style="max-width: 400px; padding: 24px;">
      <div style="width: 44px; height: 44px; border: 3px solid #E2E8F0; border-top-color: #DC2626; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;"></div>
      <p style="font-weight: 600; font-size: 15px; margin: 0 0 6px;">Opening Indus Fire Safety System...</p>
      <p style="font-size: 13px; color: #64748B; margin: 0;">Resolving scanned QR code...</p>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
