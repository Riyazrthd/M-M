    <script>
      // Immediate redirect for GitHub Pages visits from root to the production bundle in /docs/
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.includes('github.io')) {
          var p = window.location.pathname;
          if (!p.includes('/docs')) {
            var target = p.replace(/\/+$/, '') + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CSKaxaMw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B0UaL84w.css">
  </head>

        <div style="width: 44px; height: 44px; border: 3px solid #E5E7EB; border-top-color: #A80018; border-radius: 50%; animation: ifspl_spin 0.7s linear infinite;"></div>

        <style>@keyframes ifspl_spin { to { transform: rotate(360deg); } }</style>
      </div>
